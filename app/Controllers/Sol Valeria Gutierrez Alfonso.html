<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla con imagen</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            border: 2px solid #333;
            padding: 10px;
            text-align: center;
        }
        img {
            max-width: 300px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrS78sSTpiflzzi0Mu6nDR7U-hCvBQj6Q208RtYiLARg&s=10">
            </td>
        </tr>
    </table>
</body>
</html>
