<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla 3x3 con imágenes</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            border: 2px solid #333;
            padding: 5px;
            text-align: center;
            vertical-align: middle;
        }
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

    <table>
